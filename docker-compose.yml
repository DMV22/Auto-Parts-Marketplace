services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_parts_dev
    ports:
      - "5432:5432"
    volumes:
      - auto-parts-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_parts_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auto-parts-postgres-data:
