name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Static, unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm check-types

      - name: Run API unit tests
        run: pnpm --filter api exec jest --runInBand

      - name: Run web unit and component tests
        run: pnpm --filter web test

      - name: Build applications
        run: pnpm build

  api-database:
    name: API PostgreSQL integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_parts_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_parts_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_parts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auto_parts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter api prisma:validate

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Run API integration tests
        run: pnpm --filter api test:int

      - name: Run API E2E tests
        run: pnpm --filter api test:e2e
